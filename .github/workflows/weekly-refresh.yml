name: Weekly content refresh

# Roadmap §3 — keep the homepage "fresh" for search engines at least weekly.
# The build re-runs date-seeded rotation + "last updated" labels, then this job
# pushes a refresh marker so the deploy is triggered even when nothing else changed.
on:
  schedule:
    - cron: '19 6 * * 1'   # every Monday 06:19 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Stamp weekly refresh marker
        run: date -u +"%Y-%m-%d" > public/last-refreshed.txt
      - name: Build (fail fast if the site is broken)
        run: npm run build
      - name: Commit & push refresh marker (triggers Cloudflare Pages build)
        run: |
          git config user.name "brightpicks-bot"
          git config user.email "brightpicks26@gmail.com"
          git add public/last-refreshed.txt
          git commit -m "chore: weekly content refresh $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push
      - name: Deploy to Cloudflare Pages (optional — only if API token is set)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx --yes wrangler@4 pages deploy dist --project-name=kitchen-gadgets
          else
            echo "No CLOUDFLARE_API_TOKEN — skipping direct deploy. If the repo is connected to"
            echo "Cloudflare Pages via GitHub, the pushed commit above already triggers a rebuild."
          fi
